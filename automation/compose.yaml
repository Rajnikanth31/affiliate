name: considered-automation
services:
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:d02752c6ab446ae9db8deec2f9cc887c378f77cdcad31650814df936b7386dfb
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      TZ: Asia/Kolkata
      GENERIC_TIMEZONE: Asia/Kolkata
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_RESTRICT_FILE_ACCESS_TO: /files
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "500"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./workflows:/workflows:ro
      - ./runtime:/files
    mem_limit: 2g
    depends_on:
      - assistant
  assistant:
    image: node@sha256:ebfe2f90462722a7a4de65e91990e97fe0d401c70e0e762c5b53302f905ec1c1
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      MODEL: qwen2.5:1.5b
      OLLAMA_URL: http://ollama:11434
      SITE_URL: https://affiliate.agriflowe.workers.dev
    volumes:
      - ./service:/app:ro
      - ./runtime:/files
      - ../content:/content:ro
    mem_limit: 256m
    depends_on:
      - ollama
  ollama:
    image: ollama/ollama@sha256:4c5b27871a3239a717048f9b93057680a51b60c8119a7016aebb57f938e25e35
    restart: unless-stopped
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama_data:/root/.ollama
    mem_limit: 6g
volumes:
  n8n_data:
  ollama_data:
